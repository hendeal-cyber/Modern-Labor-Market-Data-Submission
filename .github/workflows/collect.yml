name: Collect postings

# Weekly flow collection. The first run captures the current open stock; each
# later run appends newly appeared postings, building the panel prospectively.
# ATS APIs expose only currently-open postings, so history cannot be backfilled.
on:
  schedule:
    - cron: "17 9 * * 1"      # Mondays 09:17 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Only probe the first N employers (0 = all)"
        required: false
        default: "0"
      no_slugs:
        description: "Skip slug-based board discovery"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python tests/run_all.py

      # Public BEA statistics, no key. continue-on-error because a missing
      # price index must never discard a successful collection: analyze.py
      # reports the price-adjusted model as unavailable instead.
      - name: Fetch BEA regional price parities
        continue-on-error: true
        run: python scripts/fetch_rpp.py

      - name: Collect from ATS boards
        id: collect
        env:
          LMSTUDY_USER_AGENT: >-
            lmstudy-research/0.1 (academic labor-market study;
            +https://github.com/${{ github.repository }})
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.limit || '0' }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.no_slugs }}" = "true" ]; then
            ARGS="$ARGS --no-slugs"
          fi
          python src/lmstudy/collect/run.py $ARGS | tee collect.log

      - name: Rebuild analysis dataset
        run: python src/lmstudy/build_dataset.py | tee build.log

      - name: Estimate the model
        run: python src/lmstudy/analyze.py | tee analyze.log

      - name: Regenerate codebook, figures and paper
        continue-on-error: true
        run: |
          python scripts/make_codebook.py
          python scripts/make_figures.py
          python scripts/make_paper.py

      - name: Rebuild the presentation
        continue-on-error: true
        run: |
          npm install --no-audit --no-fund pptxgenjs
          node scripts/make_slides.js
          pip install python-pptx
          python scripts/qa_slides.py

      - name: Summarize run
        run: |
          {
            echo "## Collection run"
            echo '```'
            tail -5 collect.log
            echo '```'
            echo "## Selection funnel"
            echo '```json'
            python -c "import json;d=json.load(open('data/analysis/selection_funnel.json'));print(json.dumps({k:d[k] for k in ['funnel','usable_by_metro','distinct_employers_with_pay','floor_met']},indent=2))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit data
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only data/ is committed. The codebook, paper and deck are
          # regenerated above for the run summary, but committing them here
          # guarantees a rebase conflict whenever they were also regenerated
          # locally — and paper/presentation.pptx is binary, so git cannot
          # auto-resolve it and the rebase-retry dies. That cost two full
          # collection runs. Regenerate deliverables locally from the
          # committed data instead; they are pure functions of it.
          git add data/
          if git diff --staged --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "Data: collection run $(date -u +%Y-%m-%d)"
          # A run that started before someone pushed would otherwise fail on a
          # non-fast-forward and throw away the data it just collected. Rebase
          # onto whatever landed meanwhile and retry.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected; rebasing onto origin/${GITHUB_REF_NAME}"
            # Raw snapshots are append-only per-employer files, so MERGING
            # them is correct: two runs' collections should combine.
            #
            # Derived files are not. `-X ours` is a merge STRATEGY OPTION, not
            # "take our file": it resolves conflicting hunks in our favour but
            # still takes non-conflicting hunks from both sides. Two runs' CSV
            # rows sit on different lines and do not conflict, so they were
            # unioned — and run 21 committed a selection_funnel.json whose own
            # totals disagreed with its own postings.csv. Nothing crashed and
            # the file was valid JSON.
            #
            # So: merge raw, then REGENERATE derived from the merged corpus.
            # A derived artifact must always be the output of one execution.
            # DISCARD the regenerated deliverables before pulling. Steps 10
            # and 11 rewrite paper/paper.md and paper/presentation.pptx but
            # only data/ is committed, so they sit dirty in the tree. On run
            # 23 `--autostash` stashed them, failed to reapply them, and left
            # BOTH files unmerged -- which then made `git commit --amend`
            # fail with "Committing is not possible because you have unmerged
            # files". `|| true` swallowed that, so the pre-rebuild commit was
            # pushed instead of the rebuilt one: a postings.csv with 221 rows
            # beside an analysis.json describing 137. The rebuild itself had
            # worked perfectly. They are pure functions of data/ and are
            # regenerated locally, so there is nothing here worth keeping.
            git checkout -- paper/ docs/ 2>/dev/null || true
            git clean -fd paper/figures 2>/dev/null || true
            if ! git pull --rebase -X ours origin "${GITHUB_REF_NAME}"; then
              git checkout --ours -- data/raw/ 2>/dev/null || true
              git add data/raw/ 2>/dev/null || true
              git rebase --continue || git rebase --abort || true
            fi
            # An unmerged path anywhere blocks the amend, so fail loudly here
            # rather than push a mismatched pair of artifacts.
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "::error::unmerged paths remain after rebase:"
              git diff --name-only --diff-filter=U
              exit 1
            fi
            echo "rebuilding derived artifacts over the merged raw corpus"
            python src/lmstudy/build_dataset.py
            # NOT `|| true`. A failed estimation leaves analysis.json
            # describing an older dataset, which is precisely the
            # inconsistency the integrity assertions exist to prevent.
            python src/lmstudy/analyze.py
            # The committed pair must agree. Run 23 pushed a CSV and an
            # analysis.json from different executions and nothing objected.
            python tests/test_consistency.py
            git add data/
            git commit --amend --no-edit
            sleep $((attempt * 5))
          done
          echo "could not push after 3 attempts"
          exit 1

      - name: Preserve the collection as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-${{ github.run_id }}
          path: |
            data/raw
            data/analysis
          retention-days: 30
          if-no-files-found: warn

      - name: Open an issue if the sample floor is still unmet
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          p = pathlib.Path("data/analysis/selection_funnel.json")
          if not p.exists():
              raise SystemExit(0)
          d = json.loads(p.read_text())
          if d.get("floor_met"):
              raise SystemExit(0)
          n = d["funnel"].get("usable_with_pay", 0)
          runs = len(d.get("snapshots", []))
          if runs < 3:
              print(f"N={n} after {runs} cycle(s); escalation threshold not reached yet")
              raise SystemExit(0)
          body = (
              f"After {runs} collection cycles the sample stands at **{n}** usable "
              f"observations, below the floor of {d['min_usable_n']}.\n\n"
              "Per the pre-registered escalation rule in `config/scope.yaml`, Tier 3 "
              "metros (Northern Virginia, Denver, Minneapolis, Seattle) should be "
              "enabled by setting `enabled: true` on those entries.\n\n"
              f"Usable by metro: `{d.get('usable_by_metro')}`\n"
              f"Distinct employers with pay: {d.get('distinct_employers_with_pay')}\n"
          )
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues",
              data=json.dumps({"title": f"Sample floor unmet: {n} usable observations",
                               "body": body, "labels": ["data"]}).encode(),
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json"},
              method="POST")
          urllib.request.urlopen(req)
          print("opened escalation issue")
          PY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
