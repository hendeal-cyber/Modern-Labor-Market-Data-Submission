# Study scope definition.
# Every filter the pipeline applies is declared here so the sampling frame is
# documentable in the methods section rather than buried in code.

study:
  name: "Early-Career Pay Determinants in Utility & Data Center Software/Data Roles"
  dependent_variable: "log(pay range midpoint), annualized USD"
  min_usable_n: 100          # hard floor; pipeline reports against this every run

# ---------------------------------------------------------------------------
# Geography. Tiers escalate ONLY when the floor is unmet (see escalation).
# ---------------------------------------------------------------------------

# Geography. National since 2026-09-21: every US location is in scope and
# location enters the model as state, census region and mandate status rather
# than as a filter. The metro definitions below are retained and still used —
# `study_metro` remains a regressor, and reverting to metro-only scope is this
# one flag.
geography:
  national: true
  countries: [US]

metros:
  chicago:
    tier: 1
    label: "Chicago, IL"
    centroid: [41.8781, -87.6298]   # the Loop
    radius_miles: 35
    state: IL
    pay_disclosure_mandate: true    # HB 3129, effective 2025-01-01, 15+ employees
  indianapolis:
    tier: 2
    label: "Indianapolis, IN"
    centroid: [39.7684, -86.1581]
    radius_miles: 35
    state: IN
    pay_disclosure_mandate: false   # Indiana has no posting-level mandate
  # Tier 3 is PRE-REGISTERED BUT DORMANT. Activated only if tiers 1+2 fail the
  # N>=100 floor after 3 collection cycles. Chosen for disclosure mandates.
  northern_virginia:
    tier: 3
    enabled: true
    label: "Northern Virginia"
    centroid: [38.9586, -77.3570]   # Ashburn
    radius_miles: 35
    state: VA
    pay_disclosure_mandate: true    # effective 2026-07-01
  denver:
    tier: 3
    enabled: true
    label: "Denver, CO"
    centroid: [39.7392, -104.9903]
    radius_miles: 35
    state: CO
    pay_disclosure_mandate: true
  minneapolis:
    tier: 3
    enabled: true
    label: "Minneapolis-St. Paul, MN"
    centroid: [44.9778, -93.2650]
    radius_miles: 35
    state: MN
    pay_disclosure_mandate: true    # 30+ employees, effective 2025-01-01
  seattle:
    tier: 3
    enabled: true
    label: "Seattle, WA"
    centroid: [47.6062, -122.3321]
    radius_miles: 35
    state: WA
    pay_disclosure_mandate: true

  # Tier 4, activated 2026-09-21. The N>=100 floor was still unmet at 40 usable
  # observations after the metro-resident frame work, and the owner's chosen
  # fallback is more pay-mandate metros rather than relaxing what counts as
  # early career. Every one has a posting-level pay mandate, so the dependent
  # variable is legally required to be present exactly as it is in Illinois.
  new_york:
    tier: 4
    enabled: true
    label: "New York City"
    centroid: [40.7128, -74.0060]
    radius_miles: 35
    state: NY
    pay_disclosure_mandate: true    # NYC LL32 2022-11; NY State 2023-09
  los_angeles:
    tier: 4
    enabled: true
    label: "Los Angeles, CA"
    centroid: [34.0522, -118.2437]
    radius_miles: 35
    state: CA
    pay_disclosure_mandate: true    # California SB 1162, 2023-01
  bay_area:
    tier: 4
    enabled: true
    label: "San Francisco Bay Area"
    centroid: [37.7749, -122.4194]
    radius_miles: 45              # the Bay Area is a genuinely wider labour
                                  # market: SF-San Jose alone is ~45 miles
    state: CA
    pay_disclosure_mandate: true    # California SB 1162, 2023-01
  boston:
    tier: 4
    enabled: true
    label: "Boston, MA"
    centroid: [42.3601, -71.0589]
    radius_miles: 35
    state: MA
    pay_disclosure_mandate: true    # Massachusetts, 2025-10, 25+ employees

  # Not a metro: the bucket for postings advertised as nationwide remote, which
  # name no state and so cannot be placed. It has no centroid, so distance
  # matching skips it, and no pay-disclosure mandate, so it stays out of the
  # HB 3129 contrast. Added 2026-09-21; see plan revision 3.
  remote_national:
    tier: 0
    pay_disclosure_mandate: false
    label: Nationwide remote

escalation:
  cycles_before_tier3: 3
  status: >
    Triggered and applied on 2026-09-21. Tiers 1+2 returned zero usable
    observations across five collection cycles. Tier 3 was measured before
    being enabled: it doubles the all-roles yield (30 -> 62).
  rule: >
    If usable observations (in-scope AND pay disclosed) from active tiers remain
    under min_usable_n after cycles_before_tier3 collection runs, enable tier 3
    metros. Tier is recorded per observation so tier-1-only results remain
    reportable as a robustness check.

# ---------------------------------------------------------------------------
# Role taxonomy: software / data / analytics ONLY.
# ---------------------------------------------------------------------------
roles:
  include_any:
    - software engineer
    - software developer
    - application developer
    - backend developer
    - frontend developer
    - full stack
    - data engineer
    - data scientist
    - data analyst
    - analytics engineer
    - business intelligence
    - bi developer
    - machine learning engineer
    - ml engineer
    - database administrator
    - database developer
    - data architect
    - quantitative analyst
    - reporting analyst
    - etl developer
    - platform engineer
    - devops engineer
    # --- Siting, land and development analytics ---
    - site selection
    - siting analyst
    - siting specialist
    - land analyst
    - land development
    - development analyst
    - "analyst, development"
    - "associate, development"
    - development associate
    - renewable development
    - "associate, renewable development"
    - permitting analyst
    - permitting specialist
    - "associate, permitting"
    - origination analyst
    - "associate, origination"
    - origination
    - site acquisition
    - real estate analyst
    - project development analyst
    # --- Regulatory, policy and compliance analytics ---
    - regulatory analyst
    - regulatory affairs
    - regulatory specialist
    - regulatory compliance analyst
    - "analyst, compliance"
    - compliance analyst
    - "associate, compliance"
    - reliability compliance
    - nerc compliance
    - nerc operations
    # Real-time reliability is grid-operations language (NERC's real-time
    # operations standards). Listed literally so that excluding equipment
    # "reliability engineer" titles on the concept path cannot drop it: AEP's
    # "Distribution System Operations Real-Time Reliability Engineer" analyses
    # DER impacts on distribution operations. Audit round 6.
    - real-time reliability
    - policy analyst
    - legislative analyst
    - energy policy
    - rate analyst
    - rates analyst
    - tariff analyst
    # --- Market, commercial and procurement analytics ---
    - market analyst
    - market analysis
    - market intelligence
    - commercial analyst
    - commercial operations associate
    - capital markets
    - procurement analyst
    - "associate, renewable procurement"
    - pricing analyst
    - energy analyst
    - energy markets
    - trading analyst
    - settlements analyst
    # --- Grid and power-system analytics (analytics-adjacent engineering only) ---
    - grid analysis
    - grid analyst
    - grid integration
    - grid modeling
    - interconnection analyst
    - interconnection engineer
    - transmission planning
    - resource planning
    - load forecasting
    - power systems analyst
    - system planning
    # --- AI and machine learning ---
    - ai engineer
    - ai application
    - applied ai
    - ai analyst
    - ai developer
    - ai platform
    - ai operations
    - artificial intelligence
    - ml engineer
    - geospatial scientist
    # A bare, word-bounded "ai" catches "AI Cybersecurity Engineer" and
    # "Manager, Applied AI", which the phrase patterns above miss. Word
    # boundaries keep it from matching inside ordinary words.
    - ai
    - machine learning
    - data scientist
    # --- Energy finance and quantitative analysis ---
    # Included under market/commercial: these are quantitative energy-sector
    # roles, and financial modelling for energy projects is squarely the kind
    # of work this study is about. Flagged for review if the boundary feels
    # wrong.
    - investment analyst
    - valuation
    - "fp&a"
    - financial planning
    - mergers and acquisitions
    - "associate, commercial contracts"
    - commercial contracts
    # --- Business/technical analysis ---
    - business analyst
    - business applications analyst
    - business operations analyst
    - business operations program analyst
    # "cad designer" and a bare "cad" used to live here. A CAD Designer is a
    # drafting role, not geospatial analytics, and it was the only observation
    # in the gis family. CAD-GIS below is what the taxonomy actually meant.
    # --- GIS and geospatial ---
    - gis
    - gis analyst
    - gis specialist
    - gis developer
    - geospatial
    - cad-gis
    # --- Sustainability and efficiency analytics ---
    - sustainability analyst
    - esg analyst
    - energy efficiency
    - demand response
    - carbon analyst
    - sustainability data
    - environmental analyst
  # Excluded even when a title partially matches. Two kinds here: roles outside
  # the energy/analytics category, and near-misses the widened taxonomy would
  # otherwise pull in ("talent development" is not development work).
  # Concept matching, tried only AFTER include_any fails.
  #
  # include_any is a list of literal phrases, so word-order, plural and
  # punctuation variants of concepts already IN the taxonomy fall straight
  # through. Measured against the committed snapshots, 27 unique postings were
  # being rejected that the taxonomy plainly covers:
  #
  #   "Energy Market Analytics Manager"     include_any has "energy markets"
  #   "Associate, Project Development"      has "associate, development"
  #   "Principal Analyst, Power Markets Modeler"
  #   "Planning Engineer, Interconnection Studies"
  #   "Director, Interconnection Execution"
  #
  # Each entry requires a hit from EVERY group, anywhere in the title, so it is
  # order-independent without being loose. These are the same families the
  # taxonomy already declares -- this widens RECOGNITION, not scope.
  include_concepts:
    - family: market_commercial
      all_of:
        - [market, markets, pricing, commodity, trading, settlements, origination]
        - [analyst, analytics, analysis, intelligence, advisor, strategist, modeler, manager, lead, director, associate]
    - family: market_commercial
      all_of:
        - [energy, power, gas, electricity, renewable]
        - [analyst, analytics, trading, trader, settlements, pricing, origination, modeler]
    - family: siting_dev
      all_of:
        - [development, siting, permitting, origination]
        - [analyst, associate, manager, director, lead, specialist, coordinator]
    - family: grid_power
      all_of:
        - [grid, transmission, interconnection, resource, load, substation, reliability]
        - [analyst, planner, planning, modeling, modeler, forecast, forecasting, studies, engineer, execution, strategy, manager, director, specialist]
    - family: regulatory
      all_of:
        - [regulatory, compliance, tariff, docket, policy]
        - [analyst, advisor, manager, specialist, lead, consultant]

  # A concept match must still respect the engineering boundary. The taxonomy
  # admits engineering only where analytics-adjacent (interconnection, grid
  # modelling, transmission and resource planning); physical design, field and
  # construction work stays out. These are judged on the title, like the other
  # exclusions.
  concept_engineering_exclude:
    - electrical
    - mechanical
    - thermal
    - commissioning
    - scada
    - relay
    - protection and control
    - transmission line
    - line engineer
    - field engineer
    - preconstruction
    - construction
    - electrician
    - technician
    - installation
    - maintenance
    - hvac
    - bess
    - solar project
    - civil
    # Found by reading everything the concept layer newly admitted, rather
    # than by assuming it was clean. Each is a real title it wrongly let in:
    #   "Site Reliability Engineer"            reliability + engineer, but SRE
    #                                          is IT infrastructure, not NERC
    #                                          reliability compliance
    #   "Manager/Senior Manager (Transfer Pricing practice)"
    #                                          pricing + manager, but transfer
    #                                          pricing is tax
    #   "Associate Principal/Pricing & Market Access (Life Sciences practice)"
    #                                          market + associate, but market
    #                                          access is pharma
    #   "Residential Business Development Director"
    #                                          development + director, but this
    #                                          is sales. The taxonomy already
    #                                          excludes "business development
    #                                          manager"; the concept layer needs
    #                                          the phrase, not the job title.
    - site reliability
    - transfer pricing
    - market access
    # Audit round 6, 2026-09-22. "reliability" admits three different jobs,
    # and only one is grid work. Read against their descriptions:
    #   AES "Engineer, Reliability", "Senior Reliability Engineer"
    #       PV+BESS inverter maintenance strategy, CMMS failure data
    #   Xcel "Plant Reliability Engineering Manager"   generating-plant O&M
    #   Vantage "Reliability Engineer, Control Systems", STACK
    #       "Infrastructure Reliability Engineer"      data-center electrical,
    #       mechanical and controls critical systems
    #   ERCOT "Senior Systems Reliability Engineer"    SLOs and observability:
    #       site reliability engineering by another name
    # All are equipment or IT reliability, which §2 of the pre-registration
    # excludes with maintenance, mechanical, electrical and commissioning work.
    # Grid reliability is written differently -- "reliability compliance",
    # "NERC", "real-time reliability" -- and those are literal includes, which
    # run before this list and are unaffected by it.
    - reliability engineer
    - reliability engineering
    - engineer reliability
    # QTS "Q-Systems" project managers deliver the in-house connectivity,
    # security and quality systems through design, installation and
    # commissioning; the fire-protection SME is the same job for life safety.
    # Construction project management, beside "construction project manager"
    # above. "Director, Development Schedule Management" owns construction
    # scheduling and progress KPIs across builds.
    - q-systems
    - q systems
    - fire protection
    - fire alarm
    - schedule management
    - business development
  exclude_any:
    # Audit round 3, 2026-09-21. Three out-of-scope roles reached the dataset:
    #   "Corporate Counsel, Corporate & Capital Markets"  (a lawyer)
    #   "Sr. Nuclear Instructor (Database Administrator)" (a training role;
    #      the DBA reference is parenthetical)
    #   "Senior Security and Compliance Analyst"          (security; round 2
    #      added "security analyst" but matching is contiguous and this reads
    #      "Security AND COMPLIANCE Analyst")
    - counsel
    - attorney
    - general counsel
    - instructor
    - trainer
    - security and compliance
    # NOT "security governance": it excluded "AI Data & Security Governance
    # Engineer", which the audit judged a genuine data-governance role and
    # recorded as borderline-but-kept. A pattern broad enough to catch it is
    # broader than the finding justified.
    # Security was named as out of scope from the start but never encoded, so
    # "AI Cybersecurity Engineer" entered the sample on a bare "ai" match.
    - cybersecurity
    - cyber security
    - information security
    - security engineer
    - security analyst
    - security officer
    - technician
    - critical facilities
    - facility
    - facilities
    - hvac
    - mechanical
    - power engineer
    - substation
    - relay
    - lineman
    - line worker
    - field service
    - network operations
    - noc
    - help desk
    - service desk
    - desktop support
    - it support
    - systems administrator
    - sales
    - account executive
    - marketing
    - recruiter
    - accountant
    - financial analyst
    - talent development
    - talent acquisition
    - business development manager
    - logistics
    - construction project manager
    - construction regional
    - marketing
    - legal operations
    - accounts payable
    - payroll
    - insurance
    - vegetation
    - custodian
    - janitorial
    - warehouse
    - route driver
    - truck driver
    # Audit round 6, 2026-09-22. Run 26 admitted back-office and security
    # roles through variant wordings of exclusions already listed above. Each
    # term below is the sibling of one that is already here, found in a real
    # title, and read against its description before being added:
    #   "Lead Talent & Organizational Development Consultant"  HR; "talent
    #       development" is listed but the ampersand breaks the phrase
    #   "Benefits Compliance and Legal Analyst - Legal"         HR benefits /
    #       legal, beside "legal operations" and "counsel"
    #   "Manager, Procurement Compliance"                       supplier-policy
    #       audit, not energy regulatory compliance
    #   "Accounting Manager - Accounting Manager Sr. - Nuclear Development"
    #       back office, beside "accountant"; admitted on "development"
    #   "Senior Financial Reporting Analyst" (AES, QTS)         same
    #   "Transmission Workplace Services Manager"               facilities
    #   "Principal, AI Security"                                security. NOT
    #       "security" alone: round 3 kept "AI Data & Security Governance
    #       Engineer" as a genuine data-governance role
    #   "Site/Civil Land Development Designer (Prin-Staff)"     AutoCAD Civil 3D
    #       drafting; "civil" was already excluded on the concept path but
    #       this title entered on the literal "land development"
    - organizational development
    - benefits compliance
    - legal analyst
    - procurement compliance
    - accounting
    - financial reporting
    - workplace services
    - ai security
    - civil
    # "Senior Service Product Specialist – AIS and GIS" (Hitachi Energy)
    # entered on the literal "gis": here it is gas-insulated SWITCHGEAR beside
    # air-insulated, not geographic information systems. A service product
    # role for substation equipment, which §2 excludes with field service.
    - ais and gis
    - switchgear

# ---------------------------------------------------------------------------
# Early career definition.
# ---------------------------------------------------------------------------
early_career:
  max_years_experience: 3
  # A posting that states no minimum is admitted rather than dropped, and the
  # `yrs_exp_stated` indicator absorbs the imputation. Measured: dropping them
  # cost roughly half the sample, and many are plainly early-career roles whose
  # text simply never names a number.
  admit_unstated_experience: true
  # Seniority became a regressor rather than a filter on 2026-09-21, by the
  # owner's decision. seniority_rank() in filters.py reads the same vocabulary
  # the exclusion list below is written in, so nothing here is deleted and
  # reverting the study to early-career-only is this one line.
  admit_all_seniority: true
  # Used when a posting states no experience minimum.
  entry_title_signals:
    - associate
    - junior
    - " jr"
    - " i "
    - " i)"
    - " ii "
    - " ii)"
    - new grad
    - new graduate
    - entry level
    - entry-level
    - early career
    - rotational
    - development program
    - graduate program
    - campus
  seniority_exclusions:
    - senior
    - " sr"
    - staff
    - principal
    - lead
    - manager
    - director
    - head of
    - vp
    - vice president
    - architect ii
    - iii
    - " iv"
    # The numeral list used to stop at IV, which let "Environmental Analyst V"
    # through as early career at $118,100. Matching is word-bounded, so "v"
    # cannot match inside "revenue" or "v2g".
    - v
    - vi
    - vii
    - viii
    # "lead" is word-bounded and so never matched "Leader". "NERC Operations
    # Team Leader" entered the sample at $122,038.
    - leader
    - team lead

# State pay-transparency mandates: states requiring a pay scale IN THE POSTING.
# This is the identification behind the disclosure model, so it lives in config
# where a reader can audit it rather than buried in code. Effective dates are
# recorded because a posting collected before a state's date is not covered by
# it — relevant if this study is ever re-run over a longer window.
#
# Deliberately EXCLUDED: states requiring disclosure only on request or only to
# candidates already in process (e.g. Cincinnati/Toledo-style ordinances,
# Connecticut's on-request rule predating its posting rule). Those do not put a
# number in the posting and would dilute the contrast.
pay_mandate_states:
  CA: 2023-01-01   # SB 1162, 15+ employees
  CO: 2021-01-01   # Equal Pay for Equal Work Act, the first
  # Connecticut's 2021 law (Public Act 21-30) is disclosure on request or
  # before an offer, which the rule above excludes. Its POSTING requirement is
  # H.B. 5003 / Public Act 26-12, effective 2026-10-01 -- after this study's
  # snapshots, so no posting collected here is covered. It was dated 2021 and
  # counted as covered until audit round 6; build_dataset now reads the dates.
  CT: 2026-10-01   # Public Act 26-12: range + benefits in every posting
  DC: 2024-06-30   # Wage Transparency Omnibus Amendment
  HI: 2024-01-01   # 50+ employees
  IL: 2025-01-01   # HB 3129, 15+ employees — the study's original anchor
  MD: 2024-10-01   # Wage Range Transparency Act
  MA: 2025-10-29   # 25+ employees
  MN: 2025-01-01   # 30+ employees
  NJ: 2025-06-01   # 10+ employees
  NY: 2023-09-17   # statewide; NYC LL32 from 2022-11-01
  VT: 2025-07-01
  VA: 2026-07-01   # newest; check coverage before relying on it
  WA: 2023-01-01   # 15+ employees
  # Removed in audit round 6 under the exclusion rule above, with no row
  # affected (the dataset holds no NV or RI posting):
  #   NV 2021-10-01  disclosure to applicants after an interview
  #   RI 2023-01-01  Pay Equity Act, R.I.G.L. 28-6-22: range on request and
  #                  before discussing compensation, not in the posting

# Census regions are defined in src/lmstudy/geo.py (CENSUS_REGION), not here,
# because they are a fixed US Census definition rather than a study choice.

internships:
  exclude: true
  # Plurals are listed explicitly: matching is word-bounded, so "internship"
  # does not match "Internships". A real posting, "2027 Summer Internships -
  # Electrical Engineering", passed the screen and entered a measurement at an
  # annualized $50,960 before this was caught.
  intern_signals:
    - intern
    - interns
    - internship
    - internships
    - co-op
    - co-ops
    - coop
    - coops
    - summer analyst
    - summer analysts
    - apprentice
    - apprentices
    - apprenticeship
  # Full-time rotational/development programs are KEPT even though they read
  # as early-career programs; they are permanent roles with benefits.
  keep_despite_signals:
    - rotational
    - development program
    - graduate program

pay:
  hours_per_year: 2080      # hourly -> annual conversion
  min_plausible_annual: 25000
  max_plausible_annual: 400000
