# Study scope definition.
# Every filter the pipeline applies is declared here so the sampling frame is
# documentable in the methods section rather than buried in code.

study:
  name: "Early-Career Pay Determinants in Utility & Data Center Software/Data Roles"
  dependent_variable: "log(pay range midpoint), annualized USD"
  min_usable_n: 100          # hard floor; pipeline reports against this every run

# ---------------------------------------------------------------------------
# Geography. Tiers escalate ONLY when the floor is unmet (see escalation).
# ---------------------------------------------------------------------------

# Geography. National since 2026-09-21: every US location is in scope and
# location enters the model as state, census region and mandate status rather
# than as a filter. The metro definitions below are retained and still used —
# `study_metro` remains a regressor, and reverting to metro-only scope is this
# one flag.
geography:
  national: true
  countries: [US]

metros:
  chicago:
    tier: 1
    label: "Chicago, IL"
    centroid: [41.8781, -87.6298]   # the Loop
    radius_miles: 35
    state: IL
    pay_disclosure_mandate: true    # HB 3129, effective 2025-01-01, 15+ employees
  indianapolis:
    tier: 2
    label: "Indianapolis, IN"
    centroid: [39.7684, -86.1581]
    radius_miles: 35
    state: IN
    pay_disclosure_mandate: false   # Indiana has no posting-level mandate
  # Tier 3 is PRE-REGISTERED BUT DORMANT. Activated only if tiers 1+2 fail the
  # N>=100 floor after 3 collection cycles. Chosen for disclosure mandates.
  northern_virginia:
    tier: 3
    enabled: true
    label: "Northern Virginia"
    centroid: [38.9586, -77.3570]   # Ashburn
    radius_miles: 35
    state: VA
    pay_disclosure_mandate: true    # effective 2026-07-01
  denver:
    tier: 3
    enabled: true
    label: "Denver, CO"
    centroid: [39.7392, -104.9903]
    radius_miles: 35
    state: CO
    pay_disclosure_mandate: true
  minneapolis:
    tier: 3
    enabled: true
    label: "Minneapolis-St. Paul, MN"
    centroid: [44.9778, -93.2650]
    radius_miles: 35
    state: MN
    pay_disclosure_mandate: true    # 30+ employees, effective 2025-01-01
  seattle:
    tier: 3
    enabled: true
    label: "Seattle, WA"
    centroid: [47.6062, -122.3321]
    radius_miles: 35
    state: WA
    pay_disclosure_mandate: true

  # Tier 4, activated 2026-09-21. The N>=100 floor was still unmet at 40 usable
  # observations after the metro-resident frame work, and the owner's chosen
  # fallback is more pay-mandate metros rather than relaxing what counts as
  # early career. Every one has a posting-level pay mandate, so the dependent
  # variable is legally required to be present exactly as it is in Illinois.
  new_york:
    tier: 4
    enabled: true
    label: "New York City"
    centroid: [40.7128, -74.0060]
    radius_miles: 35
    state: NY
    pay_disclosure_mandate: true    # NYC LL32 2022-11; NY State 2023-09
  los_angeles:
    tier: 4
    enabled: true
    label: "Los Angeles, CA"
    centroid: [34.0522, -118.2437]
    radius_miles: 35
    state: CA
    pay_disclosure_mandate: true    # California SB 1162, 2023-01
  bay_area:
    tier: 4
    enabled: true
    label: "San Francisco Bay Area"
    centroid: [37.7749, -122.4194]
    radius_miles: 45              # the Bay Area is a genuinely wider labour
                                  # market: SF-San Jose alone is ~45 miles
    state: CA
    pay_disclosure_mandate: true    # California SB 1162, 2023-01
  boston:
    tier: 4
    enabled: true
    label: "Boston, MA"
    centroid: [42.3601, -71.0589]
    radius_miles: 35
    state: MA
    pay_disclosure_mandate: true    # Massachusetts, 2025-10, 25+ employees

  # Not a metro: the bucket for postings advertised as nationwide remote, which
  # name no state and so cannot be placed. It has no centroid, so distance
  # matching skips it, and no pay-disclosure mandate, so it stays out of the
  # HB 3129 contrast. Added 2026-09-21; see plan revision 3.
  remote_national:
    tier: 0
    pay_disclosure_mandate: false
    label: Nationwide remote

escalation:
  cycles_before_tier3: 3
  status: >
    Triggered and applied on 2026-09-21. Tiers 1+2 returned zero usable
    observations across five collection cycles. Tier 3 was measured before
    being enabled: it doubles the all-roles yield (30 -> 62).
  rule: >
    If usable observations (in-scope AND pay disclosed) from active tiers remain
    under min_usable_n after cycles_before_tier3 collection runs, enable tier 3
    metros. Tier is recorded per observation so tier-1-only results remain
    reportable as a robustness check.

