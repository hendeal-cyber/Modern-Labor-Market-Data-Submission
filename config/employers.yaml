# Slug patterns discover.py derives candidates from when a company has no
# confirmed token: lowercase, strip punctuation, with and without spaces/dashes.
discovery:
  platforms: [greenhouse, lever, ashby, smartrecruiters, workable, recruitee]
  slug_transforms: [compact, hyphenated, first_word]

# Tokens confirmed to belong to a DIFFERENT company of the same name.
# Never admit these, even if slug discovery finds them again.
rejected_tokens:
  - platform: ashby
    token: constellation
    reason: >
      Belongs to a San Francisco AI startup, not Constellation Energy.
      Found by slug discovery on 2026-09-20 and rejected on inspection.
