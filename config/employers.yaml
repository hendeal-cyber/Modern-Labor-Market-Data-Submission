# Sampling frame: CORE OPERATORS ONLY.
# Utilities and data center operators. NOT engineering/EPC firms, NOT equipment
# or grid-technology vendors. This boundary was set explicitly by the study owner.
#
# IMPORTANT ON `verified`:
#   Board tokens below are CANDIDATES inferred from company naming conventions.
#   They could NOT be verified from the authoring session (network egress to all
#   ATS hosts is blocked). `collect/discover.py` probes each candidate on the
#   first live run and rewrites this file with verified: true/false plus the
#   endpoint that answered. Treat every unverified row as a hypothesis.

utilities:
  - name: Exelon
    metro: chicago
    candidates:
      workday: [{tenant: exelon, site: careers}, {tenant: exeloncorp, site: Exelon_Careers}]
      greenhouse: [exelon]
    verified: false
