# Sampling frame: CORE OPERATORS ONLY.
# Utilities and data center operators. NOT engineering/EPC firms, NOT equipment
# or grid-technology vendors. This boundary was set explicitly by the study owner.
#
# IMPORTANT ON `verified`:
#   Board tokens below are CANDIDATES inferred from company naming conventions.
#   They could NOT be verified from the authoring session (network egress to all
#   ATS hosts is blocked). `collect/discover.py` probes each candidate on the
#   first live run and rewrites this file with verified: true/false plus the
#   endpoint that answered. Treat every unverified row as a hypothesis.

utilities:
  - name: Exelon
    metro: chicago
    # BLOCKED: Exelon runs iCIMS (careers-exeloncorp.icims.com). iCIMS has no
    # free public jobs API — the real API is OAuth-gated to customers and
    # partners, and portal JSON shapes drift per tenant. Verified 2026-09-20.
    # This is the single largest expected Chicago contributor, so its absence
    # materially reduces N. See docs/limitations.md.
    ats: icims
    blocked_reason: no_free_public_api
    candidates: {}
    verified: false
  - name: ComEd
    metro: chicago
    parent: Exelon
    ats: icims          # same portal as Exelon; see the Exelon entry
    blocked_reason: no_free_public_api
    candidates: {}
    verified: false
  - name: Constellation Energy
    metro: chicago
    # iCIMS (careers-constellationenergy.icims.com). No free public API.
    # This also explains the earlier slug collision: the Ashby board at token
    # "constellation" could not have been this company, which posts nowhere
    # near Ashby.
    ats: icims
    blocked_reason: no_free_public_api
    candidates: {}
    verified: false
  - name: Nicor Gas (Southern Company Gas)
    metro: chicago
    # Southern Company publishes through southerncompany.jobs (DirectEmployers),
    # not a supported ATS. Its underlying ATS is not yet identified.
    candidates:
      workday: [{tenant: southerncompany, site: SouthernCompany}]
    verified: false
    note: careers surface is southerncompany-gas.jobs; ATS unidentified
  - name: Peoples Gas (WEC Energy Group)
    metro: chicago
    # careers.wecenergygroup.com — SAP SuccessFactors ("/go/" paths), which
    # exposes no free public jobs API.
    ats: successfactors
    blocked_reason: no_free_public_api
    candidates: {}
    verified: false
  - name: Invenergy
    metro: chicago
    candidates:
      workday: [{tenant: invenergyllc, site: invenergycareers, wd: 1}]
    verified: true      # invenergyllc.wd1.myworkdayjobs.com/invenergycareers
  - name: Vistra
    metro: chicago
    candidates:
      workday: [{tenant: vst, site: vistra_careers, wd: 5}, {tenant: vst, site: luminant_careers, wd: 5}]
    verified: true      # vst.wd5.myworkdayjobs.com/vistra_careers
  - name: Illinois American Water
    metro: chicago
    parent: American Water
    candidates:
      workday: [{tenant: amwater, site: AmericanWater}]
    verified: false
  - name: Aqua Illinois (Essential Utilities)
    metro: chicago
    candidates:
      workday: [{tenant: aquaamerica, site: Essential_Careers, wd: 5}]
    verified: true      # aquaamerica.wd5.myworkdayjobs.com/Essential_Careers
  - name: AES Indiana
    metro: indianapolis
    parent: AES Corporation
    candidates:
      workday: [{tenant: aes, site: AES_US, wd: 1}]
    verified: true      # aes.wd1.myworkdayjobs.com/AES_US
  - name: Citizens Energy Group
    metro: indianapolis
    ats: icims          # careers-citizensenergygroup.icims.com
    blocked_reason: no_free_public_api
    candidates: {}
    verified: false
  - name: Duke Energy Indiana
    metro: indianapolis
    parent: Duke Energy
    candidates:
      workday: [{tenant: dukeenergy, site: search, wd: 1}]
    verified: true      # dukeenergy.wd1.myworkdayjobs.com/search
  - name: Indiana American Water
    metro: indianapolis
    parent: American Water
    candidates:
