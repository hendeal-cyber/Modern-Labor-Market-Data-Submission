  # Corps of Engineers (ARCE) is left out: thousands of mostly civil-works
  # postings, hydropower a small part. All are coded industry `utility`,
  # the reference category, because the model has no regulator category
  # and adding one after seeing data is not done here. Federal rows are
  # identified by platform (usajobs) and isolated by the excluding_federal
