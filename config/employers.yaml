# ---------------------------------------------------------------------------
# Frame expansion, 2026-09-21. Core operators alone yield 32 usable
# observations under the widened role taxonomy, so the employer frame carries
# the rest of the way to the floor. `industry` is now categorical rather than
# binary, and the write-up must describe the population as the energy and data
# center SECTOR rather than as core operators.
# ---------------------------------------------------------------------------

grid_operators:          # RTOs/ISOs — the market operators themselves
  - name: MISO (Midcontinent ISO)
    industry: grid_operator
    metro: indianapolis
    # Headquartered in Carmel, Indiana — inside the Indianapolis radius, and
    # the RTO whose data the study owner works with directly. Its careers
    # portal is careers.misoenergy.org; the underlying ATS is not yet
    # identified, so slug candidates are offered for discovery to confirm.
    candidates:
      workday: [{tenant: misoenergy, site: MISO}, {tenant: miso, site: careers}]
      greenhouse: [misoenergy]
      icims: [misoenergy]
    verified: false
  - name: PJM Interconnection
    industry: grid_operator
    candidates:
      workday: [{tenant: pjm, site: pjmcareers, wd: 5}]
    verified: true       # pjm.wd5.myworkdayjobs.com/pjmcareers

