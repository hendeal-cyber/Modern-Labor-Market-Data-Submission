      workday: [{tenant: aes, site: AES_Careers}]
    verified: false
  - name: Citizens Energy Group
    metro: indianapolis
    candidates:
      greenhouse: [citizensenergygroup]
      workday: [{tenant: citizensenergygroup, site: careers}]
    verified: false
  - name: Duke Energy Indiana
    metro: indianapolis
    parent: Duke Energy
    candidates:
      workday: [{tenant: duke-energy, site: search}, {tenant: dukeenergy, site: careers}]
    verified: false
  - name: Indiana American Water
    metro: indianapolis
    parent: American Water
    candidates:
      workday: [{tenant: amwater, site: AmericanWater}]
    verified: false

