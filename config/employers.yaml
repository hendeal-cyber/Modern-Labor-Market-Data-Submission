  # are utilities. They collect only once the owner adds the free key as the
  # secrets USAJOBS_API_KEY and USAJOBS_USER_AGENT; until then each reads as
  # "no board found" and nothing changes. Federal pay is a separate regime:
  # analyze.py reports the disclosure contrast and the pay model without them
  # (pre-registration section 8). Southeastern PA has no active subelement
  # code of its own, and regulators (FERC, DOE headquarters) are out of scope
  # as state regulators are. ---
  # --- Batch 13, 2026-09-28, before the 29 September run: source route 3
  # widened by owner decision ("I approve options C and D", 2026-09-28) to
  # federal energy agencies, regulators included. Codes are active
  # subelements in USAJOBS's own code list (data/registry/raw/usajobs_agencies.txt).
